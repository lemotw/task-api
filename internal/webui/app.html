<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2024; --muted: #60656c;
    --line: #d9dce1; --accent: #1f6feb; --err: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101215; --panel: #181b1f; --text: #e6e8eb; --muted: #9aa0a6;
            --line: #2e3238; --accent: #58a6ff; --err: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; }
  header a { color: var(--muted); font-size: 13px; }
  form, li { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: inherit;
                     background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 8px 12px; font: inherit; color: inherit; background: var(--panel);
           border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: 0; background: none; color: var(--muted); padding: 4px 6px; }
  ul { list-style: none; margin: 16px 0 0; padding: 0; background: var(--panel);
       border: 1px solid var(--line); border-radius: 8px; }
  li { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li .name { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  li.done .name { color: var(--muted); text-decoration: line-through; }
  input[type=checkbox] { width: 18px; height: 18px; margin: 0; }
  .empty { padding: 16px 12px; color: var(--muted); }
  #error { min-height: 1.5em; margin: 8px 0 0; color: var(--err); }
  .summary { margin-top: 8px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tasks</h1>
    <a href="/test">API test console</a>
  </header>
  <form id="add">
    <input id="name" type="text" placeholder="What needs to be done?" autocomplete="off" aria-label="Task name">
    <button class="primary" type="submit">Add</button>
  </form>
  <p id="error" role="alert"></p>
  <ul id="list"></ul>
  <p id="summary" class="summary"></p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

function showError(message) { $("error").textContent = message; }

async function api(method, path, body) {
  const options = { method, headers: {} };
  if (body !== undefined) {
    options.body = JSON.stringify(body);
    options.headers["Content-Type"] = "application/json";
  }
  let response;
  try {
    response = await fetch(path, options);
  } catch (error) {
    throw new Error("Cannot reach the server.");
  }
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(data && data.error ? data.error : "HTTP " + response.status);
  return data;
}

async function refresh() {
  try {
    render(await api("GET", "/tasks"));
  } catch (error) {
    showError(error.message);
  }
}

async function run(action) {
  showError("");
  try {
    await action();
  } catch (error) {
    showError(error.message);
  }
  await refresh();
}

function render(tasks) {
  const list = $("list");
  list.replaceChildren();
  if (tasks.length === 0) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "No tasks yet.";
    list.append(empty);
  }
  for (const task of tasks) list.append(renderTask(task));
  const done = tasks.filter((t) => t.status === 1).length;
  $("summary").textContent = tasks.length ? done + " of " + tasks.length + " completed" : "";
}

function renderTask(task) {
  const item = document.createElement("li");
  if (task.status === 1) item.className = "done";

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = task.status === 1;
  box.setAttribute("aria-label", "Completed");
  box.addEventListener("change", () =>
    run(() => api("PUT", "/tasks/" + task.id, { name: task.name, status: box.checked ? 1 : 0 })));

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = task.name; // never parsed as HTML

  const edit = document.createElement("button");
  edit.className = "link";
  edit.type = "button";
  edit.textContent = "Edit";
  edit.addEventListener("click", () => startEdit(item, task));

  const del = document.createElement("button");
  del.className = "link";
  del.type = "button";
  del.textContent = "Delete";
  del.addEventListener("click", () => run(() => api("DELETE", "/tasks/" + task.id)));

  item.append(box, name, edit, del);
  return item;
}

function startEdit(item, task) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = task.name;
  input.setAttribute("aria-label", "Task name");
  const save = document.createElement("button");
  save.className = "primary";
  save.type = "button";
  save.textContent = "Save";
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "Cancel";

  const commit = () => run(() => api("PUT", "/tasks/" + task.id, { name: input.value, status: task.status }));
  save.addEventListener("click", commit);
  cancel.addEventListener("click", refresh);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") commit();
    if (event.key === "Escape") refresh();
  });
  item.replaceChildren(input, save, cancel);
  input.focus();
}

$("add").addEventListener("submit", (event) => {
  event.preventDefault();
  const name = $("name").value;
  run(async () => {
    await api("POST", "/tasks", { name, status: 0 });
    $("name").value = "";
  });
});

refresh();
</script>
</body>
</html>
